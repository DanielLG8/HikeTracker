<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo verificado - HikeTracker</title>
    <style>
        :root {
            --primary: #2E7D32;
            --primary-dark: #1B5E20;
            --bg-color: #F4F6F5;
            --card-bg: #FFFFFF;
            --text-title: #111827;
            --text-body: #4B5563;
            --text-muted: #9CA3AF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-body);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
            text-align: center;
        }

        .icon-container {
            width: 72px;
            height: 72px;
            background-color: #E8F5E9;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
        }

        .icon-container svg {
            width: 36px;
            height: 36px;
        }

        h1 {
            color: var(--text-title);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.2px;
        }

        p {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* Indicador animado de espera */
        .spinner-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid #E5E7EB;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner-text {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Botón de contingencia */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 52px;
            background-color: var(--primary);
            color: #FFFFFF;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .footer-note {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 24px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Icono de escudo con verificación -->
        <div class="icon-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <path d="m9 12 2 2 4-4"></path>
            </svg>
        </div>

        <h1>¡Correo verificado con éxito!</h1>
        <p>Tu cuenta en <strong>HikeTracker</strong> ha sido confirmada. Te estamos redirigiendo para que inicies sesión.</p>

        <!-- Spinner de carga -->
        <div class="spinner-wrapper">
            <div class="spinner"></div>
            <span class="spinner-text">Abriendo HikeTracker...</span>
        </div>

        <!-- Botón manual -->
        <a id="btnOpenApp" href="#" class="btn">
            Abrir en HikeTracker
        </a>

        <p class="footer-note">
            Si la app no se abre de forma automática, pulsa el botón verde superior.
        </p>
    </div>

    <script>
        const params = window.location.search + window.location.hash;
        const appUrl = "hiketracker://verify" + params;

        // Asignar el enlace al botón manual
        document.getElementById("btnOpenApp").href = appUrl;

        // Redirección inmediata al esquema de la aplicación
        window.location.href = appUrl;
    </script>
</body>
</html>
