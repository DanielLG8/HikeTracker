<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña - HikeTracker</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; color: #333; }
        .container { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        .btn { background-color: #2e7d32; color: white; padding: 12px 20px; text-decoration: none; border-radius: 4px; display: inline-block; margin-top: 20px; font-weight: bold; }
        h1 { color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Restablecer Contraseña</h1>
        <p>Has solicitado cambiar tu contraseña en HikeTracker.</p>
        <p>Pulsa el siguiente botón para continuar en la aplicación móvil:</p>
        <!-- Enlace con esquema personalizado que abrirá tu app Android -->
        <a id="openAppBtn" href="#" class="btn">Abrir en la aplicación</a>
    </div>

    <script>
        // Pasa los hashes de Supabase (token de recuperación) directamente a la app
        const hash = window.location.hash;
        const customSchemeUrl = "hiketracker://reset-password" + hash;
        document.getElementById("openAppBtn").href = customSchemeUrl;

        // Opcional: intentar abrir la app automáticamente
        window.location.href = customSchemeUrl;
    </script>
</body>
</html>
