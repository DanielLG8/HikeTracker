<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - HikeTracker</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; color: #333; }
        .container { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background-color: #2e7d32; color: white; padding: 10px; border: none; width: 100%; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #1b5e20; }
        h1 { color: #2e7d32; font-size: 22px; }
    </style>
    <!-- Importa el cliente JS de Supabase para manejar el cambio de contraseña en la web -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>Restablecer Contraseña</h1>
        <p>Introduce tu nueva contraseña para HikeTracker:</p>
        <input type="password" id="newPassword" placeholder="Nueva contraseña">
        <input type="password" id="confirmPassword" placeholder="Repetir contraseña">
        <button onclick="actualizarContrasena()">Cambiar Contraseña</button>
        <p id="statusMsg" style="margin-top: 15px; font-size: 14px;"></p>
    </div>

    <script>
        // Inicializa Supabase con tus credenciales públicas
        const supabaseUrl = 'https://twvttkfeqrckowujxphk.supabase.co';
        const supabaseKey = 'TU_ANON_KEY_PUBLICA'; // Pón tu clave anon de Supabase
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function actualizarContrasena() {
            const pass1 = document.getElementById('newPassword').value;
            const pass2 = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('statusMsg');

            if (!pass1 || !pass2) {
                msg.style.color = 'red';
                msg.textContent = 'Rellena ambos campos.';
                return;
            }
            if (pass1 !== pass2) {
                msg.style.color = 'red';
                msg.textContent = 'Las contraseñas no coinciden.';
                return;
            }

            try {
                // Actualiza la contraseña del usuario con la sesión activa por el token del enlace
                const { error } = await supabaseClient.auth.updateUser({ password: pass1 });
                if (error) throw error;

                msg.style.color = 'green';
                msg.textContent = '¡Contraseña actualizada con éxito! Ya puedes iniciar sesión en la app.';
            } catch (err) {
                msg.style.color = 'red';
                msg.textContent = 'Error: ' + err.message;
            }
        }
    </script>
</body>
</html>
